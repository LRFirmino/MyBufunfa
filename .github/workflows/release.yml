name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Compilar APK e publicar release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar versão com a tag
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const tag = process.env.GITHUB_REF_NAME.replace(/^v/i, '');
          const base = tag.split('-')[0];

          if (!/^\d+\.\d+\.\d+$/.test(base)) {
            console.error(
              `Tag inválida: ${process.env.GITHUB_REF_NAME}. Use o formato v1.2.3 ou v1.2.3-beta.1.`,
            );
            process.exit(1);
          }

          const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          appJson.expo.version = base;
          fs.writeFileSync('app.json', `${JSON.stringify(appJson, null, 2)}\n`);

          console.log(`Tag: ${process.env.GITHUB_REF_NAME}`);
          console.log(`Versão do app definida para: ${base}`);
          NODE

          echo "::notice::Versão do app definida pela tag ${GITHUB_REF_NAME}."

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Verificar EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::O secret EXPO_TOKEN não está configurado ou está vazio neste repositório."
            echo "Adicione em Settings → Secrets and variables → Actions → Repository secrets."
            echo "Se você criou em 'Environments', mova para 'Repository secrets' ou declare o environment no job."
            exit 1
          fi
          echo "EXPO_TOKEN presente (${#EXPO_TOKEN} caracteres)."

      - name: Configurar EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Compilar APK no EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json

      - name: Obter URL do APK
        id: apk
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const raw = fs.readFileSync('eas-build.json', 'utf8');
          const parsed = JSON.parse(raw);
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url = build?.artifacts?.buildUrl;

          if (!url) {
            console.error('O build terminou sem um artifact de APK.');
            console.error(JSON.stringify(build, null, 2));
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `apk_url=${url}\n`);
          console.log(`APK disponível em: ${url}`);
          NODE

      - name: Baixar APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            --header "Authorization: Bearer ${EXPO_TOKEN}" \
            --output "mybufunfa-${GITHUB_REF_NAME}.apk" \
            "${{ steps.apk.outputs.apk_url }}"

      - name: Publicar release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="mybufunfa-${TAG}.apk"
          PRERELEASE=""

          case "${TAG}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} já existe; enviando o APK novamente."
            gh release upload "${TAG}" "${APK}" --clobber
          else
            gh release create "${TAG}" "${APK}" \
              --title "${TAG}" \
              --generate-notes \
              ${PRERELEASE}
          fi

      - name: Resumo
        run: |
          {
            echo "## Release ${GITHUB_REF_NAME} publicada"
            echo ""
            echo "- APK: \`mybufunfa-${GITHUB_REF_NAME}.apk\`"
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"
